[project]
name = "buschain"
version = "0.1.0"
description = "Bus trip chaining system — deterministic routing over the LDC planner data contract"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "openpyxl>=3.1",
    "python-multipart>=0.0.9",  # FastAPI file uploads
]

[project.optional-dependencies]
# The rule-8 exact solver (engine/solve.py). Optional: without it the app
# runs unchanged and the Optimize action reports the solver as unavailable.
solver = [
    # <4: PuLP 4.0 removes the current LpVariable/PULP_CBC_CMD API
    # (see engine/solve.py's migration note).
    "pulp>=2.8,<4",  # bundles the CBC solver binary
]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.90",
    "httpx>=0.27",   # FastAPI TestClient transport
    "pulp>=2.8,<4",  # solver tests
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["buschain*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Error tier only (real bugs: undefined names, unused imports, syntax-adjacent
# mistakes) — style opinions stay out so the lint never argues with the code's
# deliberate shape. Ignored on the same principle: every zip here pairs
# deliberately unequal or by-construction-equal sequences (B905), and `l` for
# a link plus small test lambdas are house convention (E741, E731).
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B905", "E731", "E741"]
